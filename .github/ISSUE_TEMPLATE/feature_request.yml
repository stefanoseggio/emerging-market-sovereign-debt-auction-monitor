name: Feature Request
description: Propose a new input field, output field, or behavior change
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing ISIN/CUSIP tracking, a true bid-to-cover ratio, or a forward-looking auction
        calendar? Read this Actor's documented doctrine first (README → "A note on two metrics
        this README will not overclaim" and "What this actor deliberately does not do") — this
        source doesn't publish the underlying data for the first two, and the real auction
        calendar is an unstructured PDF press release, not a structured feed.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the real use case this would unblock, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What input field, output field, or behavior would you like to see added?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New input filter
        - New output field
        - New alerting channel
        - Delta-engine / classification logic change
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Can this already be achieved with existing inputs (e.g. bondTypeFilter, yieldChangeThresholdBps, coverageRatioFloor)? If so, why isn't that sufficient?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this isn't already possible with an existing input field (see README → Input reference)
          required: true
        - label: If this proposes a new metric, I confirmed Tesouro Transparente actually publishes the underlying data for it
          required: false
